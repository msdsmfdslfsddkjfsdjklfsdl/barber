name: Deploy to GitHub Pages

# This prototype is a zero-build static site (React + Babel-standalone loaded
# from a CDN in index.html), so "building" is just packaging the files as-is
# and handing them to GitHub Pages.

on:
  push:
    branches:
      - main
      - claude/gallant-einstein-CBtBx
  workflow_dispatch:

# Permissions required by the GitHub Pages deployment actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        # enablement: true turns on GitHub Pages (with the "GitHub Actions"
        # source) automatically on the first run, so no manual setup is needed.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage site
        # Copy the app into _site, leaving out repo plumbing and docs so the
        # published artifact contains only what the browser needs to load.
        run: |
          mkdir -p _site
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            --exclude='README.md' \
            ./ _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
