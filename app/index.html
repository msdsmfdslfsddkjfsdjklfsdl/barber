<!DOCTYPE html>

<head>

<meta name="theme-color" content="#C8893B" />

<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #100D0A; }
  body { font-family: "Inter", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
         color: #FAF6EF; -webkit-font-smoothing: antialiased; }
  [dir="rtl"] { font-feature-settings: "kern" 1, "liga" 1; }
  *, *::before, *::after { box-sizing: border-box; }
  button, input, textarea { font-family: inherit; }
  button, [role="button"], a, input, textarea, select { touch-action: manipulation; }
  :focus-visible { outline: 2px solid #E0A85B; outline-offset: 2px; border-radius: 4px; }
  #root { height: 100%; width: 100%; max-width: 520px; margin: 0 auto; overflow: hidden; }
  .fc-boot { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
  .fc-boot-logo { width: 72px; height: 72px; border-radius: 20px; background: linear-gradient(145deg,#E0A85B,#C8893B); display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 30px -8px rgba(224,168,91,0.4); }
  .fc-boot-name { font-size: 18px; font-weight: 800; letter-spacing: -0.01em; color: #FAF6EF; }
  .fc-boot-spin { width: 26px; height: 26px; border-radius: 50%; border: 3px solid rgba(224,168,91,0.25); border-top-color: #E0A85B; animation: fc-spin .8s linear infinite; }
  @keyframes fc-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
</style>
</head>
<body>
  <div id="root"><div class="fc-boot" aria-hidden="true"><div class="fc-boot-logo"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="#1C1813" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg></div><div class="fc-boot-name">Barber 16</div><div class="fc-boot-spin"></div></div></div>

  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/babel.min.js"></script>

  <script type="text/babel" src="src/data.jsx"></script>
  <script type="text/babel" src="src/ui.jsx"></script>
  <script type="text/babel" src="src/helpers.jsx"></script>
  <script type="text/babel" src="src/barber-fast.jsx"></script>

  <script type="text/babel">
    function BarberAppRoot() {
      const [lang, setLang] = React.useState('fr');
      React.useEffect(() => {
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      }, [lang]);
      return <BarberFast lang={lang} setLang={setLang} density="busy" barberId="sofiane"
                         liveBookings={[]} barberOverrides={{}} onUpdateProfile={() => {}} />;
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<BarberAppRoot />);
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
  </script>
</body>
