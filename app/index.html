<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Fade City — Barbier</title>

<!-- PWA: installable barber app -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#C8893B" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Fade City" />
<meta name="mobile-web-app-capable" content="yes" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #100D0A; }
  body { font-family: "Inter", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
         color: #FAF6EF; -webkit-font-smoothing: antialiased; }
  [dir="rtl"] { font-feature-settings: "kern" 1, "liga" 1; }
  *, *::before, *::after { box-sizing: border-box; }
  button, input, textarea { font-family: inherit; }
  #root { height: 100%; width: 100%; max-width: 520px; margin: 0 auto; overflow: hidden; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/babel.min.js"></script>

  <script type="text/babel" src="src/data.jsx"></script>
  <script type="text/babel" src="src/ui.jsx"></script>
  <script type="text/babel" src="src/helpers.jsx"></script>
  <script type="text/babel" src="src/barber-fast.jsx"></script>

  <script type="text/babel">
    function BarberAppRoot() {
      const [lang, setLang] = React.useState('fr');
      React.useEffect(() => {
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      }, [lang]);
      return <BarberFast lang={lang} setLang={setLang} density="busy" barberId="sofiane"
                         liveBookings={[]} barberOverrides={{}} onUpdateProfile={() => {}} />;
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<BarberAppRoot />);
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
  </script>
</body>
</html>
