<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fade City — Booking & Queue · Prototype</title>

<!-- PWA: installable + theming -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#C8893B" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Fade City" />
<meta name="mobile-web-app-capable" content="yes" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #100D0A;
               background-image: radial-gradient(1100px 760px at 50% -8%, #2A1E10 0%, rgba(16,13,10,0) 58%); }
  body { font-family: "Inter", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
         color: #F9FAFB; -webkit-font-smoothing: antialiased;
         text-rendering: optimizeLegibility;
         font-feature-settings: "cv11" 1, "ss01" 1; }
  /* Arabic typography: slightly larger optical size + a touch more line-height */
  [dir="rtl"] { font-feature-settings: "kern" 1, "liga" 1; letter-spacing: 0; }
  [dir="rtl"] input, [dir="rtl"] button, [dir="rtl"] h1, [dir="rtl"] h2 {
    letter-spacing: 0;
  }
  *, *::before, *::after { box-sizing: border-box; }
  button { font-family: inherit; }
  input, textarea { font-family: inherit; }
  input::placeholder { color: #4B5563; }
  input:focus { border-color: #C8893B !important; }
  ::selection { background: #C8893B55; }
  button, [role="button"], a, input, textarea, select { touch-action: manipulation; }
  :focus-visible { outline: 2px solid #E0A85B; outline-offset: 2px; border-radius: 4px; }
  .fc-boot { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
  .fc-boot-logo { width: 72px; height: 72px; border-radius: 20px; background: linear-gradient(145deg,#E0A85B,#C8893B); display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 30px -8px rgba(224,168,91,0.4); }
  .fc-boot-name { font-size: 18px; font-weight: 800; letter-spacing: -0.01em; color: #FAF6EF; }
  .fc-boot-spin { width: 26px; height: 26px; border-radius: 50%; border: 3px solid rgba(224,168,91,0.25); border-top-color: #E0A85B; animation: fc-spin .8s linear infinite; }
  @keyframes fc-spin { to { transform: rotate(360deg); } }

  /* Ambient pulsing light circles in the background — like a heartbeat */
  .ambient-blur {
    position: fixed; pointer-events: none; z-index: 0;
    border-radius: 50%; filter: blur(70px);
    will-change: transform, opacity;
  }
  .ambient-blur.a { top: -120px; left: -120px; width: 420px; height: 420px;
                    background: radial-gradient(circle, rgba(200,137,59,0.20), transparent 70%);
                    animation: heart-pulse 6s ease-in-out infinite, drift-a 32s ease-in-out infinite; }
  .ambient-blur.b { bottom: -160px; right: -160px; width: 500px; height: 500px;
                    background: radial-gradient(circle, rgba(224,168,91,0.13), transparent 70%);
                    animation: heart-pulse 6s ease-in-out infinite 0.3s, drift-b 38s ease-in-out infinite; }
  .ambient-blur.c { top: 35%; right: -140px; width: 340px; height: 340px;
                    background: radial-gradient(circle, rgba(166,110,42,0.16), transparent 70%);
                    animation: heart-pulse 6s ease-in-out infinite 0.6s, drift-c 28s ease-in-out infinite; }
  @keyframes heart-pulse {
    0%, 100% { opacity: 0.16; transform: scale(1); }
    50%      { opacity: 0.28; transform: scale(1.06); }
  }
  @keyframes drift-a {
    0%, 100% { transform: translate(0, 0); }
    50%      { transform: translate(60px, 80px); }
  }
  @keyframes drift-b {
    0%, 100% { transform: translate(0, 0); }
    50%      { transform: translate(-80px, -60px); }
  }
  @keyframes drift-c {
    0%, 100% { transform: translate(0, 0); }
    50%      { transform: translate(-40px, 50px); }
  }

  /* Respect users who prefer less motion: still the ambient glow + all animation. */
  @media (prefers-reduced-motion: reduce) {
    .ambient-blur { animation: none !important; opacity: 0.14; }
    *, *::before, *::after {
      animation-duration: 0.001ms !important; animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important; scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>
  <div class="ambient-blur a"></div>
  <div class="ambient-blur b"></div>
  <div class="ambient-blur c"></div>
  <div id="root"><div class="fc-boot" aria-hidden="true"><div class="fc-boot-logo"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="#1C1813" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg></div><div class="fc-boot-name">Fade City</div><div class="fc-boot-spin"></div></div></div>

  <!-- React + Babel are vendored locally (in vendor/) so the app has no
       external runtime dependency: it loads faster and never breaks if a CDN
       is down or blocked. -->
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/babel.min.js"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>

  <script type="text/babel" src="src/data.jsx"></script>
  <script type="text/babel" src="src/ui.jsx"></script>
  <script type="text/babel" src="src/customer-flow.jsx"></script>
  <script type="text/babel" src="src/queue-tracker.jsx"></script>
  <script type="text/babel" src="src/barber-app.jsx"></script>
  <script type="text/babel" src="src/barber-fast.jsx"></script>
  <script type="text/babel" src="src/app.jsx"></script>

  <!-- PWA: register the service worker for installability + offline shell -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
